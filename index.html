<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Videollamada P2P</title>
  <link rel="stylesheet" href="style.css">
  <!-- Carga de la librería de PeerJS desde CDN -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
  <main class="container">
    <h1>Videollamada P2P</h1>

    <!-- 1. Elegir nombre -->
    <div class="card">
      <input type="text" id="my-name-input" placeholder="Elegí tu nombre (ej: juan)"
             maxlength="20" autocapitalize="none" autocomplete="off" autocorrect="off">
      <button id="connect-btn">Conectar</button>
    </div>
    <p class="hint">Tu nombre: <strong id="my-id">sin conectar</strong></p>

    <!-- 2. Llamar -->
    <div class="card">
      <input type="text" id="peer-id-input" placeholder="Nombre de la otra persona"
             maxlength="20" autocapitalize="none" autocomplete="off" autocorrect="off">
      <button id="call-btn" disabled>Llamar</button>
    </div>

    <!-- 3. Controles de la llamada -->
    <div class="controls">
      <button id="hangup-btn" class="btn-danger" disabled>Cortar</button>
      <button id="rec-btn" class="btn-rec" disabled>Grabar</button>
    </div>

    <p id="status" class="status">Elegí un nombre y tocá Conectar.</p>
    <p id="download-area" class="status hidden">
      Última grabación: <a id="download-link" href="#">Descargar</a>
    </p>

    <!-- Reproductores de Video -->
    <div class="video-grid">
      <div class="video-box">
        <p>Mi Cámara</p>
        <video id="local-video" autoplay playsinline muted></video>
      </div>
      <div class="video-box">
        <p>Remoto</p>
        <video id="remote-video" autoplay playsinline></video>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
